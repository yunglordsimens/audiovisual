<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js Text</title>
    <style>
        body { margin:0; overflow:hidden; background:transparent; }
        canvas { display:block; outline:none; }
    </style>
    <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }}
    </script>
</head>
<body>
<script src="js/lab-bridge.js"></script>
<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

let scene, camera, renderer, textMesh, materials = [], loadedFont = null;

const state = LabBridge.getState();
let localText = state.text, localB = state.params.b, localC = state.params.c;

init();

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 10000);
    camera.position.set(0, 0, 600);

    scene.add(new THREE.DirectionalLight(0xffffff, 4).translateZ(1));
    const pt = new THREE.PointLight(0x00ffff, 2, 800);
    pt.position.set(0, 0, 100); scene.add(pt);

    renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    new FontLoader().load(
        'https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
        font => { loadedFont = font; refreshText(); }
    );

    addEventListener('resize', () => {
        camera.aspect = innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });

    // Debounced rebuild on parameter/text change
    let rebuildTimer = null;
    LabBridge.onUpdate((s, textChanged) => {
        const needsRebuild = textChanged ||
            Math.abs(localB - s.params.b) > 0.03 ||
            Math.abs(localC - s.params.c) > 0.03;
        
        if (needsRebuild) {
            localText = s.text; localB = s.params.b; localC = s.params.c;
            clearTimeout(rebuildTimer);
            rebuildTimer = setTimeout(refreshText, 80);
        }
    });

    animate();
}

function refreshText() {
    if (!loadedFont) return;
    const s = LabBridge.getState();

    // Dispose old resources
    if (textMesh) {
        scene.remove(textMesh);
        textMesh.geometry.dispose();
        materials.forEach(m => m.dispose());
    }

    const depth = 10 + s.params.b * 100;
    const geo = new TextGeometry(s.text, {
        font: loadedFont, size:80, height:depth,
        curveSegments:4, bevelEnabled:true,
        bevelThickness:2, bevelSize:1.5, bevelSegments:3
    });
    geo.computeBoundingBox();
    geo.translate(-0.5 * (geo.boundingBox.max.x - geo.boundingBox.min.x), 0, 0);

    const color = new THREE.Color().setHSL(s.params.c, 1.0, 0.5);
    materials = [
        new THREE.MeshPhongMaterial({ color, flatShading:true }),
        new THREE.MeshPhongMaterial({ color:0x111111, wireframe:true })
    ];
    textMesh = new THREE.Mesh(geo, materials);
    scene.add(textMesh);
}

function animate() {
    requestAnimationFrame(animate);
    if (textMesh) {
        const s = LabBridge.getState();
        const speed = (s.params.a - 0.5) * 0.1;
        textMesh.rotation.x += speed * 0.5;
        textMesh.rotation.y += speed;
    }
    renderer.render(scene, camera);
}
</script>
</body>
</html>
