<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Anim API</title>
    <link rel="stylesheet" href="css/showcase-base.css">
    <style>
        .char-wrapper { display:flex; font-size:8vw; font-weight:900; text-transform:uppercase; letter-spacing:0.1em; }
        .char { display:inline-block; transform-origin:center bottom; will-change:transform,opacity,filter; white-space:pre; color:var(--primary); }
    </style>
</head>
<body>
    <div class="viewport">
        <div class="char-wrapper" id="chars"></div>
    </div>
    <div class="selector-bar">
        <button class="mode-btn active" onclick="setMode('elastic',this)">ELASTIC</button>
        <button class="mode-btn" onclick="setMode('stagger',this)">STAGGER</button>
        <button class="mode-btn" onclick="setMode('warp',this)">TIME_WARP</button>
    </div>
<script src="js/lab-bridge.js"></script>
<script>
const container = document.getElementById('chars');
let mode = 'elastic', anims = [];

window.setMode = function(m, btn) {
    mode = m;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    build();
};

LabBridge.onTextChange(() => build());

// Only rebuild DOM on text change; for param changes, update live
let paramUpdateTimer = null;
LabBridge.onUpdate((state, textChanged) => {
    if (!textChanged) {
        clearTimeout(paramUpdateTimer);
        paramUpdateTimer = setTimeout(() => {
            if (mode === 'warp') updateWarpRate();
            // elastic/stagger: CSS vars handle most changes, only rebuild if needed
        }, 50);
    }
});

function build() {
    container.innerHTML = '';
    anims.forEach(a => a.cancel()); anims = [];
    const s = LabBridge.getState();
    const els = s.text.split('').map(ch => {
        const span = document.createElement('span');
        span.className = 'char'; span.textContent = ch;
        container.appendChild(span); return span;
    });
    if (mode === 'elastic') runElastic(els);
    else if (mode === 'stagger') runStagger(els);
    else if (mode === 'warp') runWarp(els);
}

function runElastic(els) {
    const s = LabBridge.getState();
    const dur = 2000 - s.params.a * 1500;
    const bounce = s.params.c;
    const kf = [
        { transform:'scale(0)', offset:0 },
        { transform:`scale(${1+bounce})`, offset:0.4 },
        { transform:`scale(${1-bounce*0.5})`, offset:0.6 },
        { transform:`scale(${1+bounce*0.2})`, offset:0.8 },
        { transform:'scale(1)', offset:1 }
    ];
    els.forEach((el, i) => {
        anims.push(el.animate(kf, { duration:dur, delay:i*(s.params.b*200), easing:'linear', fill:'both', iterations:Infinity, direction:'alternate' }));
    });
}

function runStagger(els) {
    const s = LabBridge.getState();
    const dur = 1000 + s.params.a * 1000;
    const y = 20 + s.params.c * 100;
    const kf = [
        { transform:`translateY(${y}px)`, opacity:0.2, filter:'blur(10px)' },
        { transform:`translateY(-${y}px)`, opacity:1, filter:'blur(0px)' },
        { transform:`translateY(${y}px)`, opacity:0.2, filter:'blur(10px)' }
    ];
    els.forEach((el, i) => {
        anims.push(el.animate(kf, { duration:dur, delay:i*(s.params.b*300), easing:'ease-in-out', iterations:Infinity }));
    });
}

function runWarp(els) {
    const s = LabBridge.getState();
    const rate = (s.params.a - 0.5) * 4;
    const kf = [
        { transform:'rotateX(0) rotateY(0)', color:'var(--primary)' },
        { transform:'rotateX(180deg) rotateY(90deg)', color:'#FFF', offset:0.5 },
        { transform:'rotateX(360deg) rotateY(0)', color:'var(--primary)' }
    ];
    els.forEach((el, i) => {
        const a = el.animate(kf, { duration:3000, delay:i*(s.params.c*-500), iterations:Infinity, easing:'linear' });
        a.playbackRate = rate;
        anims.push(a);
    });
}

function updateWarpRate() {
    const rate = (LabBridge.getState().params.a - 0.5) * 4;
    anims.forEach(a => { a.playbackRate = rate; });
}

build();
</script>
</body>
</html>
