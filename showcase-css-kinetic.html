<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Kinetic</title>
    <link rel="stylesheet" href="css/showcase-base.css">
    <style>
        body { justify-content:center; }
        .track {
            white-space:nowrap; will-change:transform;
            font-weight:900; text-transform:uppercase;
            -webkit-text-stroke:1px #FFF; color:transparent; opacity:0.8;
        }
        .row-1 { color:transparent; -webkit-text-stroke:2px var(--primary); }
        .row-2 { color:hsl(var(--hue),100%,50%); -webkit-text-stroke:0; }
        .row-3 { color:transparent; -webkit-text-stroke:1px #FC0; }
    </style>
</head>
<body>
    <div class="viewport" style="flex-direction:column;justify-content:center;">
        <div class="track row-1" id="t1"></div>
        <div class="track row-2" id="t2"></div>
        <div class="track row-3" id="t3"></div>
    </div>
<script src="js/lab-bridge.js"></script>
<script>
const rows = [document.getElementById('t1'), document.getElementById('t2'), document.getElementById('t3')];
let off = [0, 0, 0];

function updateContent() {
    const s = LabBridge.getState();
    const repeated = (s.text + '  ').repeat(20);
    rows.forEach(r => r.textContent = repeated);
    const fontSize = 50 + s.params.b * 150;
    rows.forEach(r => r.style.fontSize = fontSize + 'px');
}

LabBridge.onTextChange(updateContent);
LabBridge.onUpdate(updateContent);

function animate() {
    const s = LabBridge.getState();
    const speed = 2 + s.params.a * 20;
    off[0] -= speed;
    off[1] += speed * (1 + s.params.c);
    off[2] -= speed * (0.5 + s.params.c);

    // Smooth loop: reset based on actual text width
    for (let i = 0; i < 3; i++) {
        const w = rows[i].scrollWidth / 2;
        if (Math.abs(off[i]) > w) off[i] = 0;
    }
    rows[0].style.transform = `translateX(${off[0]}px)`;
    rows[1].style.transform = `translateX(${off[1]}px)`;
    rows[2].style.transform = `translateX(${off[2]}px)`;
    requestAnimationFrame(animate);
}

updateContent();
animate();
</script>
</body>
</html>
