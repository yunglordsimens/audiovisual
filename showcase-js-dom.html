<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS DOM Engine</title>
    <link rel="stylesheet" href="css/showcase-base.css">
    <style>
        .decoder-container { font-family:'Share Tech Mono',monospace; font-size:5vw; text-transform:uppercase; letter-spacing:5px; display:flex; }
        .char-span { display:inline-block; min-width:0.6em; text-align:center; transition:color 0.1s; }
        .char-span.decoding { color:#FFF; text-shadow:0 0 10px #FFF; }
        .char-span.done { color:var(--primary); }

        .stack-container { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .stack-layer { font-size:6vw; font-weight:900; line-height:0.85; text-transform:uppercase; color:transparent; -webkit-text-stroke:1px rgba(255,255,255,0.3); transition:all 0.1s linear; }
        .stack-layer.main { color:var(--primary); -webkit-text-stroke:0; text-shadow:0 0 20px var(--primary); z-index:10; }

        .float-container { position:relative; width:100%; height:100%; }
        .float-char { position:absolute; font-weight:bold; user-select:none; cursor:default; will-change:transform; left:0; top:0; }
    </style>
</head>
<body>
    <div class="viewport" id="viewport"></div>
    <div class="selector-bar">
        <button class="mode-btn active" onclick="setMode('decoder',this)">DECODER</button>
        <button class="mode-btn" onclick="setMode('stack',this)">STACK</button>
        <button class="mode-btn" onclick="setMode('float',this)">FLOAT</button>
    </div>
<script src="js/lab-bridge.js"></script>
<script>
const vp = document.getElementById('viewport');
let mode = 'decoder', raf = null;

LabBridge.onTextChange(() => initMode());

window.setMode = function(m, btn) {
    mode = m;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    initMode();
};

function initMode() {
    cancelAnimationFrame(raf); vp.innerHTML = '';
    if (mode === 'decoder') initDecoder();
    else if (mode === 'stack') initStack();
    else if (mode === 'float') initFloat();
}

function randomChar() { return "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_!<>[]"[Math.floor(Math.random()*42)]; }

function initDecoder() {
    const s = LabBridge.getState();
    const c = document.createElement('div'); c.className = 'decoder-container';
    const spans = s.text.split('').map(ch => {
        const sp = document.createElement('span');
        sp.className = 'char-span decoding'; sp.innerText = randomChar();
        sp.dataset.target = ch; sp.dataset.cycles = 0;
        c.appendChild(sp); return sp;
    });
    vp.appendChild(c);

    function loop() {
        const st = LabBridge.getState();
        spans.forEach((sp, idx) => {
            if (sp.classList.contains('done')) return;
            if (Math.random() > 0.5) { sp.innerText = randomChar(); sp.dataset.cycles = +sp.dataset.cycles + 1; }
            const thresh = 10 + idx * (5 + st.params.b * 20);
            if (+sp.dataset.cycles > thresh) { sp.innerText = sp.dataset.target; sp.className = 'char-span done'; }
        });
        if (spans.every(s => s.classList.contains('done'))) { if (Math.random() < 0.008) initDecoder(); }
        raf = requestAnimationFrame(loop);
    }
    loop();
}

function initStack() {
    const s = LabBridge.getState();
    const c = document.createElement('div'); c.className = 'stack-container';
    const layers = 7, els = [];
    for (let i = 0; i < layers; i++) {
        const d = document.createElement('div'); d.className = 'stack-layer'; d.innerText = s.text;
        if (i === 3) d.classList.add('main');
        c.appendChild(d); els.push(d);
    }
    vp.appendChild(c);
    let t = 0;
    function loop() {
        const st = LabBridge.getState();
        t += 0.02 + st.params.a * 0.1;
        const ampX = st.params.b * 100;
        els.forEach((el, i) => {
            const off = i - 3;
            const x = Math.sin(t + off * 0.5) * (ampX * Math.abs(off) * 0.5);
            const skew = Math.cos(t + off * 0.5) * (off * 5);
            el.style.transform = `translateX(${x}px) skewX(${skew}deg)`;
            if (!el.classList.contains('main')) el.style.opacity = 1 - Math.abs(off) * 0.2;
        });
        raf = requestAnimationFrame(loop);
    }
    loop();
}

function initFloat() {
    const s = LabBridge.getState();
    const c = document.createElement('div'); c.className = 'float-container';
    const W = window.innerWidth, H = window.innerHeight;
    const parts = s.text.split('').filter(ch => ch !== ' ').map((ch, i) => {
        const el = document.createElement('div'); el.className = 'float-char'; el.innerText = ch;
        c.appendChild(el);
        return { el, x: Math.random()*W, y: Math.random()*H, vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2, rot:Math.random()*360 };
    });
    vp.appendChild(c);

    function loop() {
        const st = LabBridge.getState();
        const spd = st.params.a * 2, rotSpd = st.params.c * 5;
        parts.forEach(p => {
            p.x += p.vx * spd; p.y += p.vy * spd; p.rot += rotSpd;
            if (p.x < 0 || p.x > W - 40) p.vx *= -1;
            if (p.y < 0 || p.y > H - 40) p.vy *= -1;
            p.x = Math.max(0, Math.min(W - 40, p.x));
            p.y = Math.max(0, Math.min(H - 40, p.y));
            p.el.style.transform = `translate(${p.x}px,${p.y}px) rotate(${p.rot}deg)`;
            p.el.style.color = `hsl(${st.hue},100%,50%)`;
            p.el.style.fontSize = (4 + st.params.b * 4) + 'vw';
        });
        raf = requestAnimationFrame(loop);
    }
    loop();
}

initMode();
</script>
</body>
</html>
