<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Filter FX</title>
    <link rel="stylesheet" href="css/showcase-base.css">
    <style>
        .hero-text {
            font-size:12vw; font-weight:900; text-transform:uppercase;
            white-space:nowrap; position:relative;
            transition:all 0.3s; cursor:default; user-select:none;
        }

        /* LIQUID */
        .mode-liquid .hero-text {
            color:#FFF;
            filter:blur(calc(var(--val-b)*15px + 2px)) contrast(calc(var(--val-b)*10 + 10));
            animation:liquidPulse calc(3s / (var(--val-a) + 0.2)) infinite ease-in-out;
        }
        @keyframes liquidPulse { 0%,100%{letter-spacing:normal} 50%{letter-spacing:-10px} }

        /* RGB SHIFT */
        .mode-rgb .hero-text {
            color:white;
            text-shadow:calc(var(--val-b)*-10px) 0 #FF0000, calc(var(--val-b)*10px) 0 #0000FF;
            animation:rgbShake calc(0.2s / (var(--val-a)+0.1)) infinite;
        }
        @keyframes rgbShake {
            0%{transform:translate(0,0)} 25%{transform:translate(calc(var(--val-c)*5px),calc(var(--val-c)*5px))}
            50%{transform:translate(calc(var(--val-c)*-5px),0)} 75%{transform:translate(0,calc(var(--val-c)*-5px))} 100%{transform:translate(0,0)}
        }

        /* NEON */
        .mode-neon .hero-text {
            color:transparent;
            -webkit-text-stroke:calc(var(--val-b)*3px + 1px) var(--primary);
            filter:drop-shadow(0 0 calc(var(--val-c)*20px) var(--primary));
            animation:neonFlicker calc(1s / (var(--val-a)+0.1)) infinite;
        }
        @keyframes neonFlicker { 0%,19%,21%,23%,25%,54%,56%,100%{opacity:1} 20%,24%,55%{opacity:0.3} }

        /* GLITCH — fixed: no opaque backgrounds */
        .mode-glitch .hero-text { color:#FFF; position:relative; }
        .mode-glitch .hero-text::before, .mode-glitch .hero-text::after {
            content:attr(data-text); position:absolute; top:0; left:0; width:100%; height:100%;
            background:transparent;
        }
        .mode-glitch .hero-text::before {
            left:2px; text-shadow:-1px 0 #ff00c1; clip-path:inset(0 0 60% 0);
            animation:glitchTop calc(2s / (var(--val-a)+0.5)) infinite linear alternate-reverse;
        }
        .mode-glitch .hero-text::after {
            left:-2px; text-shadow:-1px 0 #00fff9; clip-path:inset(40% 0 0 0);
            animation:glitchBot calc(1.5s / (var(--val-a)+0.5)) infinite linear alternate-reverse;
        }
        @keyframes glitchTop { 0%{clip-path:inset(10% 0 80% 0);transform:translate(-5px,0)} 20%{clip-path:inset(80% 0 5% 0);transform:translate(5px,0)} 100%{clip-path:inset(40% 0 40% 0);transform:translate(-2px,0)} }
        @keyframes glitchBot { 0%{clip-path:inset(70% 0 20% 0);transform:translate(5px,0)} 100%{clip-path:inset(10% 0 60% 0);transform:translate(-5px,0)} }

        /* VAPOR */
        .mode-vapor .hero-text {
            background:linear-gradient(to bottom, #00FFFF, #FF00FF);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            transform:skew(calc(var(--val-a)*-30deg)); position:relative;
        }
        .mode-vapor .hero-text::after {
            content:attr(data-text); position:absolute; left:0; top:80%;
            transform:scaleY(-0.6) skew(calc(var(--val-a)*30deg));
            opacity:calc(var(--val-c)*0.5);
            background:linear-gradient(to top, rgba(255,0,255,0.8), transparent);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; filter:blur(2px);
        }

        /* HAZARD */
        .mode-hazard .hero-text {
            color:transparent;
            background-image:repeating-linear-gradient(45deg,#000,#000 10px,var(--primary) 10px,var(--primary) calc(var(--val-c)*20px+10px));
            -webkit-background-clip:text; background-size:200% 200%;
            animation:hazardFlow calc(5s / (var(--val-a)+0.1)) linear infinite;
        }
        @keyframes hazardFlow { 0%{background-position:0% 50%} 100%{background-position:100% 50%} }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="viewport">
        <div class="wrapper mode-liquid" id="fx-wrap">
            <div class="hero-text" id="output" data-text="SYSTEM">SYSTEM</div>
        </div>
    </div>
    <div class="selector-bar">
        <button class="mode-btn active" onclick="setMode('mode-liquid',this)">LIQUID</button>
        <button class="mode-btn" onclick="setMode('mode-rgb',this)">RGB_SHIFT</button>
        <button class="mode-btn" onclick="setMode('mode-neon',this)">NEON</button>
        <button class="mode-btn" onclick="setMode('mode-glitch',this)">GLITCH</button>
        <button class="mode-btn" onclick="setMode('mode-vapor',this)">VAPOR</button>
        <button class="mode-btn" onclick="setMode('mode-hazard',this)">HAZARD</button>
    </div>
<script src="js/lab-bridge.js"></script>
<script>
const textEl = document.getElementById('output');
const wrapEl = document.getElementById('fx-wrap');

window.setMode = function(cls, btn) {
    wrapEl.className = 'wrapper ' + cls;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
};

LabBridge.onUpdate((state) => {
    textEl.textContent = state.text;
    textEl.setAttribute('data-text', state.text);
});

if (LabBridge.isStandalone()) {
    textEl.textContent = "STANDALONE";
    textEl.setAttribute('data-text', "STANDALONE");
}
</script>
</body>
</html>
