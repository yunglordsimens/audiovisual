<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SVG Vectors</title>
    <link rel="stylesheet" href="css/showcase-base.css">
    <style>
        svg { width:100%; height:100%; max-height:80vh; }
        text { font-family:'Rajdhani',sans-serif; font-weight:900; text-anchor:middle; dominant-baseline:middle; }
        .neon-text { fill:none; stroke:var(--primary); stroke-linecap:round; }
        .neon-glow { fill:none; stroke:var(--primary); opacity:0.3; filter:blur(10px); }
        .elastic-path { fill:none; stroke:rgba(255,255,255,0.1); stroke-width:1; stroke-dasharray:5 5; }
        .elastic-text { fill:var(--primary); }
        .glitch-text { fill:#FFF; }
    </style>
</head>
<body>
    <div class="viewport">
        <svg viewBox="0 0 800 400" id="main-svg">
            <defs>
                <filter id="dispFilter">
                    <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" result="turb" id="turb"/>
                    <feDisplacementMap in2="turb" in="SourceGraphic" scale="30" xChannelSelector="R" yChannelSelector="G" id="disp"/>
                </filter>
            </defs>
            <g id="grp-neon" style="display:none">
                <text x="400" y="200" class="neon-glow" font-size="120" id="neon-glow-t">SVG</text>
                <text x="400" y="200" class="neon-text" font-size="120" id="neon-main-t">SVG</text>
            </g>
            <g id="grp-elastic" style="display:none">
                <path id="textCurve" d="M 50 200 Q 400 200 750 200" class="elastic-path"/>
                <text font-size="80" class="elastic-text">
                    <textPath href="#textCurve" startOffset="50%" text-anchor="middle" id="elastic-tp">SVG VECTOR</textPath>
                </text>
            </g>
            <g id="grp-glitch" style="display:none">
                <text x="400" y="200" class="glitch-text" font-size="150" filter="url(#dispFilter)" id="glitch-t">GLITCH</text>
            </g>
        </svg>
    </div>
    <div class="selector-bar">
        <button class="mode-btn active" onclick="setMode('neon',this)">NEON_WIRE</button>
        <button class="mode-btn" onclick="setMode('elastic',this)">ELASTIC</button>
        <button class="mode-btn" onclick="setMode('glitch',this)">LIQUID_GLITCH</button>
    </div>
<script src="js/lab-bridge.js"></script>
<script>
let mode = 'neon', time = 0;
const groups = { neon: document.getElementById('grp-neon'), elastic: document.getElementById('grp-elastic'), glitch: document.getElementById('grp-glitch') };

window.setMode = function(m, btn) {
    mode = m;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    Object.values(groups).forEach(g => g.style.display = 'none');
    groups[m].style.display = 'block';
    updateText();
};

function updateText() {
    const t = LabBridge.getState().text;
    document.getElementById('neon-glow-t').textContent = t;
    document.getElementById('neon-main-t').textContent = t;
    document.getElementById('elastic-tp').textContent = t;
    document.getElementById('glitch-t').textContent = t;
}

LabBridge.onTextChange(updateText);
setMode('neon', document.querySelector('.mode-btn'));

function animate() {
    const s = LabBridge.getState();
    time += 0.01 + s.params.a * 0.05;

    if (mode === 'neon') {
        const w = 1 + s.params.b * 4;
        const dash = s.params.c * 300;
        ['neon-glow-t','neon-main-t'].forEach(id => {
            const el = document.getElementById(id);
            el.setAttribute('stroke-width', w);
            el.setAttribute('stroke-dasharray', `${dash} ${dash/2}`);
            el.setAttribute('stroke-dashoffset', time * -100);
        });
    } else if (mode === 'elastic') {
        const amp = s.params.b * 150;
        const freq = 1 + s.params.c * 5;
        const cy = 200 + Math.sin(time * freq) * amp;
        const cx = 400 + Math.cos(time * freq * 0.5) * (amp * 0.5);
        document.getElementById('textCurve').setAttribute('d', `M 50 200 Q ${cx} ${cy} 750 200`);
    } else if (mode === 'glitch') {
        const scale = s.params.b * 100;
        const freq = 0.01 + s.params.c * 0.2;
        document.getElementById('disp').setAttribute('scale', scale);
        document.getElementById('turb').setAttribute('baseFrequency', `${freq} ${0.02 + Math.sin(time)*0.01}`);
    }
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
