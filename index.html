<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography Lab</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

    <iframe id="background-iframe" src="" aria-hidden="true"></iframe>
    <div id="graph-layer"></div>

    <div class="ui-overlay">
        <div class="menu-panel" id="menu-panel">
            <div class="menu-header">
                <div class="menu-tag">// RESEARCH ARCHIVE</div>
                <h1>TYPO_LAB <span class="ver">v9</span></h1>
                <div class="menu-status" id="menu-status">READY :: <span id="node-count">0</span> NODES</div>
            </div>
            <div id="tree-container"></div>
        </div>
        <div class="resizer" id="resizer"><div class="resizer-grip"></div></div>
    </div>

    <div class="brutalist-input-wrapper" id="input-module">
        <div class="module-header" id="input-header">:: TARGET_INPUT</div>
        <input type="text" id="global-text-input" placeholder="TYPE HERE..." value="PHILIPELEPELEPLEIN" spellcheck="false" autocomplete="off">
    </div>

    <div class="control-deck" id="control-deck">
        <div class="module-header" id="deck-header">:: CONTROL_MODULE</div>
        <div class="slider-group">
            <label>VAR_A <span class="sv" id="val-a">50</span></label>
            <input type="range" id="param-a" min="0" max="100" value="50">
        </div>
        <div class="slider-group">
            <label>VAR_B <span class="sv" id="val-b">50</span></label>
            <input type="range" id="param-b" min="0" max="100" value="50">
        </div>
        <div class="slider-group">
            <label>VAR_C <span class="sv" id="val-c">10</span></label>
            <input type="range" id="param-c" min="0" max="100" value="10">
        </div>
        <div class="export-group">
            <label>:: EXPORT ::</label>
            <div class="export-buttons">
                <button class="btn-mini" data-fmt="svg">SVG</button>
                <button class="btn-mini" data-fmt="png">PNG</button>
                <button class="btn-mini" data-fmt="jpeg">JPG</button>
            </div>
        </div>
    </div>

    <div id="window-container">
        <div class="win-header" id="win-header">
            <span class="win-title" id="win-title">INIT</span>
            <button class="win-close" id="win-close">&times;</button>
        </div>
        <div class="win-content" id="win-content"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
