<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Canvas Pixel FX</title>
    <style>
        body { margin:0; overflow:hidden; background:transparent; height:100vh; }
        canvas { display:block; width:100%; height:100%; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script src="js/lab-bridge.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
let particles = [];
let needsRescan = true;

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; needsRescan = true; }
window.addEventListener('resize', resize);
resize();

class Particle {
    constructor(x, y) {
        this.x = x; this.y = y; this.ox = x; this.oy = y; this.vx = 0; this.vy = 0;
    }
    update(state) {
        const chaos = state.params.c * 5;
        this.vx += (Math.random() - 0.5) * chaos;
        this.vy += (Math.random() - 0.5) * chaos;
        const speed = 0.01 + state.params.a * 0.1;
        this.vx += (this.ox - this.x) * speed;
        this.vy += (this.oy - this.y) * speed;
        this.vx *= 0.9; this.vy *= 0.9;
        this.x += this.vx; this.y += this.vy;
    }
    draw(state) {
        const s = 1 + state.params.b * 4;
        ctx.fillStyle = `hsl(${state.hue}, 100%, 55%)`;
        ctx.fillRect(this.x, this.y, s, s);
    }
}

function scanText() {
    particles = [];
    const state = LabBridge.getState();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const fontSize = Math.min(canvas.width, canvas.height) * 0.18;
    ctx.font = `bold ${fontSize}px monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'white';
    ctx.fillText(state.text, canvas.width / 2, canvas.height / 2);

    const idata = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const step = canvas.width > 1000 ? 5 : 6;
    for (let y = 0; y < canvas.height; y += step) {
        for (let x = 0; x < canvas.width; x += step) {
            if (idata[(y * canvas.width + x) * 4 + 3] > 128) {
                particles.push(new Particle(x, y));
            }
        }
    }
    needsRescan = false;
}

LabBridge.onTextChange(() => { needsRescan = true; });

function animate() {
    if (needsRescan) scanText();
    const state = LabBridge.getState();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) { p.update(state); p.draw(state); }
    requestAnimationFrame(animate);
}

scanText();
animate();
</script>
</body>
</html>
