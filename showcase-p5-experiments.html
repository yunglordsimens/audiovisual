<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>p5.js Experiments</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <link rel="stylesheet" href="css/showcase-base.css">
    <style>
        #canvas-container { flex:1; position:relative; overflow:hidden; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="selector-bar">
        <button class="mode-btn active" onclick="changeMode('SWARM',this)">SWARM</button>
        <button class="mode-btn" onclick="changeMode('WEB',this)">LINE_WEB</button>
        <button class="mode-btn" onclick="changeMode('FLUID',this)">FLUID</button>
    </div>
<script src="js/lab-bridge.js"></script>
<script>
let currentMode = 'SWARM';
let particles = [];
const MAX_PARTICLES = 2000;

window.changeMode = function(m, btn) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = m;
    particles.forEach(p => { p.vx = 0; p.vy = 0; });
};

LabBridge.onTextChange(() => sampleText());

function setup() {
    let cnv = createCanvas(windowWidth, windowHeight);
    cnv.parent('canvas-container');
    colorMode(HSB, 360, 100, 100, 100);
    textAlign(CENTER, CENTER);
    sampleText();
}

function draw() {
    clear();
    const s = LabBridge.getState();
    let speed = 0.5 + s.params.a * 2;
    if (currentMode === 'SWARM') drawSwarm(s, speed);
    else if (currentMode === 'WEB') drawWeb(s, speed);
    else if (currentMode === 'FLUID') drawFluid(s, speed);
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); sampleText(); }

function sampleText() {
    particles = [];
    const s = LabBridge.getState();
    let gfx = createGraphics(width, height);
    gfx.pixelDensity(1); gfx.background(0);
    gfx.fill(255); gfx.textAlign(CENTER, CENTER);
    gfx.textSize(min(width, height) * 0.22);
    gfx.textStyle(BOLD); gfx.textFont('Rajdhani');
    gfx.text(s.text, width/2, height/2);
    gfx.loadPixels();
    
    // Adaptive step to limit particles
    let step = floor(map(s.params.b, 0, 1, 14, 5));
    for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
            if (gfx.pixels[(x + y * width) * 4] > 128) {
                particles.push({ tx:x, ty:y, x:random(width), y:random(height), vx:0, vy:0, bx:x, by:y });
                if (particles.length >= MAX_PARTICLES) { gfx.remove(); return; }
            }
        }
    }
    gfx.remove();
}

function drawSwarm(s, speed) {
    const chaos = s.params.c * 5;
    noStroke(); fill(s.hue, 80, 100);
    for (const p of particles) {
        p.vx += (p.tx - p.x) * 0.05 * speed;
        p.vy += (p.ty - p.y) * 0.05 * speed;
        let dm = dist(mouseX, mouseY, p.x, p.y);
        if (dm < 100) {
            let f = map(dm, 0, 100, 20, 0);
            let a = atan2(p.y - mouseY, p.x - mouseX);
            p.vx += cos(a) * f; p.vy += sin(a) * f;
        }
        p.vx += random(-chaos, chaos); p.vy += random(-chaos, chaos);
        p.vx *= 0.85; p.vy *= 0.85;
        p.x += p.vx; p.y += p.vy;
        circle(p.x, p.y, 3);
    }
}

function drawWeb(s, speed) {
    stroke(s.hue, 80, 100, 40); strokeWeight(1);
    const maxD = 20 + s.params.c * 30;
    const len = particles.length;
    for (let i = 0; i < len; i++) {
        const p = particles[i];
        p.x = lerp(p.x, p.tx, 0.1 * speed);
        p.y = lerp(p.y, p.ty, 0.1 * speed);
        // Only check a few random neighbors (O(n) not O(n^2))
        if (i % 3 === 0 && len > 1) {
            const j = floor(random(len));
            const n = particles[j];
            if (dist(p.x, p.y, n.x, n.y) < maxD) line(p.x, p.y, n.x, n.y);
        }
        point(p.x, p.y);
    }
}

function drawFluid(s, speed) {
    noStroke(); fill(s.hue, 80, 100, 80);
    const t = millis() * 0.001 * speed;
    const ns = 0.02, flow = 10 + s.params.c * 50;
    for (const p of particles) {
        let n = noise(p.bx * ns, p.by * ns, t);
        let a = n * TWO_PI * 2;
        p.x = lerp(p.x, p.bx + cos(a) * flow, 0.1);
        p.y = lerp(p.y, p.by + sin(a) * flow, 0.1);
        circle(p.x, p.y, 2 + n * 4);
    }
}
</script>
</body>
</html>
